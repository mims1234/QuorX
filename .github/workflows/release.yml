# Builds the Windows installer when a version tag is pushed, and publishes it as a GitHub release.
# The release is the update feed: installed apps read latest.yml from releases/latest/download (desktop/package.json →
# quorx.updateUrl), and winget points at that version's own release (quorx.winget.downloadBase).
#
# To release: npm run release:bump (raises the version everywhere), commit, then
#   git tag v<version> && git push origin main v<version>
# The tag must match desktop/package.json's version, or the build stops before doing anything.
#
# Hardening: actions are pinned to commits; the build job can only read the repository (dependency install scripts
# run there, with no tokens); only the publish job can write, and only after the "release" environment approves it
# (Settings → Environments → release → required reviewers). The tag name reaches scripts through env, never inline.
name: Release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Check the tag matches the app version
        id: ver
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $app = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($tag -notmatch '^\d+\.\d+\.\d+$') { Write-Error "The tag must look like v1.2.3."; exit 1 }
          if ($tag -ne $app) { Write-Error "The tag is v$tag but desktop/package.json says $app. Run npm run release:bump, commit, and tag that version."; exit 1 }
          "VERSION=$app" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "version=$app" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install the harness (node-pty, xterm, KaTeX)
        run: npm ci

      - name: Install Electron and electron-builder
        run: npm ci
        working-directory: desktop

      - name: Build the installer
        # --publish never: the publish job uploads the files itself (electron-builder's generic provider can't publish).
        run: npm --prefix desktop run dist -- --publish never

      - name: Write the checksums
        shell: pwsh
        run: |
          $d = 'desktop/dist'
          $lines = foreach ($f in "QuorX-Setup-$env:VERSION.exe", 'latest.yml') { "{0}  {1}" -f (Get-FileHash "$d/$f" -Algorithm SHA256).Hash.ToLower(), $f }
          $lines | Set-Content "$d/SHA256SUMS.txt" -Encoding ascii
          Get-Content "$d/SHA256SUMS.txt"

      - name: Write the winget manifests for this version
        run: npm run winget

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-files
          path: |
            desktop/dist/latest.yml
            desktop/dist/QuorX-Setup-${{ steps.ver.outputs.version }}.exe
            desktop/dist/QuorX-Setup-${{ steps.ver.outputs.version }}.exe.blockmap
            desktop/dist/SHA256SUMS.txt
            desktop/dist/winget/${{ steps.ver.outputs.version }}

  publish:
    needs: build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write     # create the release and upload its files
      id-token: write     # sign the build attestation (proof the installer was built here, from this tag)
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-files
          path: dist

      - name: Check the files against their checksums
        shell: pwsh
        run: |
          foreach ($line in Get-Content dist/SHA256SUMS.txt) {
            $hash, $name = $line -split '\s+', 2
            if ((Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower() -ne $hash) { Write-Error "$name does not match its checksum"; exit 1 }
          }

      - name: Attest where the installer was built
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/QuorX-Setup-${{ env.VERSION }}.exe

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG "dist/latest.yml" "dist/QuorX-Setup-$env:VERSION.exe" "dist/QuorX-Setup-$env:VERSION.exe.blockmap" "dist/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY --title "QuorX $env:TAG" --generate-notes

      # After the first version is in winget-pkgs (submitted by hand once), later versions can go in by themselves:
      # add a GitHub token with public_repo scope as the WINGET_TOKEN secret (in the release environment).
      # wingetcreate is a fixed version, checked against its published SHA-256 before it runs.
      - name: Send the new version to winget-pkgs
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if (-not $env:WINGET_TOKEN) { "No WINGET_TOKEN: skipped."; exit 0 }
          Invoke-WebRequest https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash.ToLower() -ne '24042bd37915805615e6cf969ac57c6439124c3fe85823327f5f3fb24bd9ffea') { Write-Error 'wingetcreate.exe does not match its published checksum'; exit 1 }
          ./wingetcreate.exe submit --token $env:WINGET_TOKEN "dist/winget/$env:VERSION"
